# Railway configuration for backend service
# Using Dockerfile (Node 20) for builds

[build]
# Dockerfile will be used if present; keep a buildCommand fallback for non-docker builds
buildCommand = "yarn install && yarn build"

[deploy]
# Start command: the Docker image handles migrations via entrypoint; runtime start only
startCommand = "yarn start:prod"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
# App listens on process.env.PORT (default 3000)
internalPort = 3000
