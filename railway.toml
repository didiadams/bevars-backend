[build]
# Using a Dockerfile instead of the deprecated nixpacks builder.
# Railway will detect and build the Dockerfile in the `backend/` context.
buildCommand = "yarn install && yarn build"

[deploy]
startCommand = "yarn migration:run:prod && yarn start:prod"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 3000
