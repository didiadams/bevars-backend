# Railway configuration for NestJS backend
# Uses Dockerfile for builds — entrypoint handles migrations + start

[build]
# Railway auto-detects Dockerfile; no buildCommand needed

[deploy]
# Dockerfile ENTRYPOINT handles everything; no startCommand needed
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 3000
