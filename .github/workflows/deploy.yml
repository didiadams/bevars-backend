name: Deploy Backend to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend to DigitalOcean

    steps:
      - name: 📢 Deployment Started
        run: |
          echo "🚀 DEPLOYMENT STARTED"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
      - name: Deploy Backend to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          script: |
            echo "🚀 Starting Backend Deployment..."

            # Navigate to backend directory (we're already here since workflow is in backend repo)
            cd ~/bevars-exports/backend

            # Set production environment
            export NODE_ENV=production

            # Pull latest changes
            echo "� Pulling latest code from GitHub..."
            git pull origin main

            # Install dependencies
            echo "📦 Installing/updating dependencies..."
            yarn install --frozen-lockfile --production=false

            # Build backend
            echo "🔨 Building TypeScript backend..."
            yarn build

            # Restart backend with PM2
            echo "🔄 Restarting backend application..."
            pm2 restart bevars-backend || pm2 start ecosystem.config.js --env production

            # Check application status
            echo "🔍 Checking backend status..."
            pm2 status bevars-backend
            pm2 logs bevars-backend --lines 5

            # Health check - wait for app to start
            echo "🩺 Performing health check..."
            sleep 10

            # Test if API is responding
            if curl -f -s http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Health check passed - API is responding"
            else
              echo "⚠️ Health check failed - API might not be ready yet"
              echo "📋 Recent logs:"
              pm2 logs bevars-backend --lines 10 --nostream
            fi

            echo "✅ Backend deployment completed successfully!"
            echo "🔧 Backend API: http://${{ secrets.DO_HOST }}:3001"
            echo "📊 Deployment Details:"
            echo "  - Commit: $GITHUB_SHA"
            echo "  - Branch: $GITHUB_REF_NAME"
            echo "  - Triggered by: $GITHUB_ACTOR"
