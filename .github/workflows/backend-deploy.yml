name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      - name: Run Linting
        run: yarn lint

      - name: Run Tests
        run: yarn test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: test_db
          JWT_SECRET: test-jwt-secret

      - name: Run E2E Tests
        run: yarn test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: test_db
          JWT_SECRET: test-jwt-secret

      - name: Build Application
        run: yarn build

      - name: Check Build Output
        run: |
          ls -la dist/
          echo "Build completed successfully"

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      - name: Run Security Audit
        run: yarn audit --level moderate

      - name: Check for Vulnerabilities
        run: |
          if yarn audit --level high --json | grep -q '"type":"auditAdvisory"'; then
            echo "High severity vulnerabilities found!"
            exit 1
          else
            echo "No high severity vulnerabilities found"
          fi

  deploy-staging:
    name: Deploy to Staging
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo "🚀 Starting staging deployment..."

            # Navigate to staging directory
            cd /home/bevars/bevars-exporters-staging/backend

            # Create backup
            echo "📦 Creating backup..."
            cp -r dist dist_backup_$(date +%Y%m%d_%H%M%S) 2>/dev/null || true

            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/develop

            # Install dependencies
            echo "📦 Installing dependencies..."
            yarn install --production

            # Build application
            echo "🔨 Building application..."
            yarn build

            # Run database migrations
            echo "🗄️ Running migrations..."
            yarn migration:run

            # Restart application
            echo "🔄 Restarting application..."
            pm2 restart bevars-backend-staging

            # Health check
            echo "🏥 Health check..."
            sleep 10
            if curl -f http://localhost:3001/health; then
              echo "✅ Staging deployment successful!"
            else
              echo "❌ Staging deployment failed!"
              # Rollback if needed
              pm2 restart bevars-backend-staging
              exit 1
            fi

  deploy-production:
    name: Deploy to Production
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Notify Deployment Start
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🚀 Backend Production Deployment Started",
              attachments: [{
                color: 'warning',
                fields: [{
                  title: 'Repository',
                  value: '${{ github.repository }}',
                  short: true
                }, {
                  title: 'Commit',
                  value: '${{ github.sha }}',
                  short: true
                }]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "🚀 Starting production deployment..."

            # Navigate to production directory
            cd /home/bevars/bevars-exporters/backend

            # Create backup
            echo "📦 Creating backup..."
            timestamp=$(date +%Y%m%d_%H%M%S)
            cp -r dist dist_backup_$timestamp 2>/dev/null || true
            pg_dump -h localhost -U bevars_user -d bevars_exporters > /home/bevars/backups/pre_deploy_backup_$timestamp.sql

            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main

            # Install dependencies
            echo "📦 Installing dependencies..."
            yarn install --production

            # Build application
            echo "🔨 Building application..."
            yarn build

            # Run database migrations
            echo "🗄️ Running migrations..."
            yarn migration:run

            # Restart application with zero downtime
            echo "🔄 Restarting application..."
            pm2 reload bevars-backend --update-env

            # Health check
            echo "🏥 Health check..."
            sleep 15
            for i in {1..5}; do
              if curl -f http://localhost:3001/health; then
                echo "✅ Production deployment successful!"
                exit 0
              else
                echo "⏳ Attempt $i failed, retrying..."
                sleep 10
              fi
            done

            echo "❌ Production deployment failed!"
            echo "🔄 Rolling back..."
            pm2 restart bevars-backend
            exit 1

      - name: Notify Deployment Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '✅ Backend Production Deployment Successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Deployment Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Backend Production Deployment Failed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  health-check:
    name: Post-Deployment Health Check
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Application Startup
        run: sleep 30

      - name: Health Check
        run: |
          echo "🏥 Running comprehensive health checks..."

          # API Health Check
          if curl -f ${{ secrets.PRODUCTION_URL }}/health; then
            echo "✅ API Health Check Passed"
          else
            echo "❌ API Health Check Failed"
            exit 1
          fi

          # Database Health Check
          if curl -f ${{ secrets.PRODUCTION_URL }}/api/health/database; then
            echo "✅ Database Health Check Passed"
          else
            echo "❌ Database Health Check Failed"
            exit 1
          fi

          # Performance Check
          response_time=$(curl -o /dev/null -s -w '%{time_total}' ${{ secrets.PRODUCTION_URL }}/api/exporters)
          if (( $(echo "$response_time < 2.0" | bc -l) )); then
            echo "✅ Performance Check Passed (${response_time}s)"
          else
            echo "⚠️ Performance Check Warning (${response_time}s)"
          fi
